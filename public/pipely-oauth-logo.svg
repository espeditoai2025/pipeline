<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0f1b2d"/>

  <!-- Pipeline curve path -->
  <path d="M 120 340 Q 210 280 256 230 Q 300 180 390 140"
        stroke="url(#lineGrad)" stroke-width="14" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Node 1 - small blue left -->
  <circle cx="120" cy="340" r="28" fill="#4A90E2"/>
  <circle cx="120" cy="340" r="20" fill="#5BA3F5"/>

  <!-- Node 2 - medium blue center -->
  <circle cx="256" cy="230" r="38" fill="#2D6FDB"/>
  <circle cx="256" cy="230" r="28" fill="#4A90E2"/>

  <!-- Node 3 - large teal right -->
  <circle cx="390" cy="140" r="52" fill="none" stroke="#00C9A7" stroke-width="8" opacity="0.8"/>
  <circle cx="390" cy="140" r="40" fill="#00C9A7"/>
  <circle cx="390" cy="140" r="28" fill="#00DDB8"/>

  <!-- "Pipely" wordmark -->
  <text x="256" y="430"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="800"
        fill="white" text-anchor="middle"
        letter-spacing="-2">Pipely</text>

  <!-- Underline accent -->
  <rect x="196" y="444" width="120" height="6" rx="3" fill="#00C9A7"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#00C9A7"/>
    </linearGradient>
  </defs>
</svg>
